<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ Citation du jour</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-grad-start: #4facfe;
      --bg-grad-end: #00f2fe;
      --card-bg: #ffffff;
      --title-color: #333;
      --quote-color: #2b2d42;
      --author-color: #0077b6;
      --border-color: #e6e6ec;
    }

    body.dark {
      --bg-grad-start: #232526;
      --bg-grad-end: #0f2027;
      --card-bg: #1e1e2f;
      --title-color: #f1f1f1;
      --quote-color: #f1f1f1;
      --author-color: #4facfe;
      --border-color: #35354a;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg-grad-start) 0%, var(--bg-grad-end) 100%);
      padding: 2rem;
      transition: background 0.3s ease;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 560px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      padding: 2.5rem 2rem;
      text-align: center;
      transition: background 0.3s ease;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .card-header h1 {
      font-size: 1.4rem;
      color: var(--title-color);
    }

    .theme-toggle {
      border: none;
      background: transparent;
      font-size: 1.3rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .theme-toggle:hover {
      background: rgba(79, 172, 254, 0.12);
    }

    #quote {
      font-size: 1.3rem;
      font-style: italic;
      color: var(--quote-color);
      line-height: 1.6;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease, color 0.3s ease;
    }

    #quote.fade {
      opacity: 0;
    }

    #author {
      margin-top: 1rem;
      font-weight: 600;
      color: var(--author-color);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      margin-top: 2rem;
    }

    button.action-btn {
      padding: 0.8rem 1.4rem;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s, background 0.2s, color 0.2s;
    }

    button.action-btn:active {
      transform: scale(0.97);
    }

    #new-quote-btn {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: #fff;
    }

    #copy-btn {
      background: transparent;
      border: 2px solid var(--border-color);
      color: var(--title-color);
    }

    #share-btn {
      background: #1d9bf0;
      color: #fff;
    }

    #favorite-btn {
      background: transparent;
      border: 2px solid var(--border-color);
      color: var(--title-color);
    }

    #favorite-btn.is-active {
      background: linear-gradient(135deg, #ffd166, #ff9f1c);
      border-color: transparent;
      color: #fff;
    }

    #favorites-view-btn {
      background: transparent;
      border: 2px solid var(--border-color);
      color: var(--title-color);
    }

    button.action-btn:hover {
      opacity: 0.9;
    }

    /* --- Modale des favoris --- */

    .favorites-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 1000;
    }

    .favorites-modal.open {
      display: flex;
    }

    .favorites-modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: background 0.3s ease;
    }

    .favorites-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .favorites-modal-header h2 {
      font-size: 1.1rem;
      color: var(--title-color);
    }

    .favorites-close-btn {
      border: none;
      background: transparent;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--title-color);
      line-height: 1;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .favorites-close-btn:hover {
      background: rgba(79, 172, 254, 0.12);
    }

    .favorites-list {
      list-style: none;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .favorites-empty {
      text-align: center;
      color: var(--quote-color);
      padding: 1rem 0;
      font-style: italic;
    }

    .favorite-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.6rem 0.8rem;
    }

    .favorite-item-text {
      flex: 1;
      text-align: left;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--quote-color);
      font-size: 0.9rem;
      font-style: italic;
      line-height: 1.4;
    }

    .favorite-item-text strong {
      color: var(--author-color);
      font-style: normal;
    }

    .favorite-item-remove {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="card-header">
      <h1>✨ Citation du jour</h1>
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Changer de thème"
        title="Changer de thème"
      >🌙</button>
    </div>

    <p id="quote">Cliquez sur le bouton pour afficher une citation inspirante.</p>
    <p id="author"></p>

    <div class="actions">
      <button id="new-quote-btn" class="action-btn" type="button">🔄 Nouvelle citation</button>
      <button id="copy-btn" class="action-btn" type="button">📋 Copier</button>
      <button id="share-btn" class="action-btn" type="button">🐦 Partager sur X</button>
      <button id="favorite-btn" class="action-btn" type="button" aria-pressed="false">☆ Favori</button>
      <button id="favorites-view-btn" class="action-btn" type="button">📁 Favoris (0)</button>
    </div>
  </main>

  <div id="favorites-modal" class="favorites-modal" aria-hidden="true">
    <div class="favorites-modal-content" role="dialog" aria-modal="true" aria-label="Citations favorites">
      <div class="favorites-modal-header">
        <h2>⭐ Mes citations favorites</h2>
        <button id="favorites-close-btn" class="favorites-close-btn" type="button" aria-label="Fermer">✖</button>
      </div>
      <ul id="favorites-list" class="favorites-list"></ul>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------
    // Citation du jour — logique de la page
    // Une liste de citations est tirée au sort à chaque clic.
    // Thème clair/sombre mémorisé, copie, partage et favoris
    // de la citation, persistés dans le localStorage.
    // ---------------------------------------------------------

    const THEME_STORAGE_KEY = "citation-du-jour-theme";
    const FAVORITES_STORAGE_KEY = "citation-du-jour-favorites";

    const QUOTES = [
      { text: "La vie, c'est comme une bicyclette, il faut avancer pour ne pas perdre l'équilibre.", author: "Albert Einstein" },
      { text: "Le succès, c'est tomber sept fois et se relever huit.", author: "Proverbe japonais" },
      { text: "L'imagination est plus importante que le savoir.", author: "Albert Einstein" },
      { text: "Ce n'est pas parce que les choses sont difficiles que nous n'osons pas, c'est parce que nous n'osons pas qu'elles sont difficiles.", author: "Sénèque" },
      { text: "Le futur appartient à ceux qui croient à la beauté de leurs rêves.", author: "Eleanor Roosevelt" },
      { text: "Il n'y a qu'une façon d'échouer, c'est d'abandonner avant d'avoir réussi.", author: "Georges Clemenceau" },
      { text: "La meilleure façon de prédire l'avenir, c'est de le créer.", author: "Peter Drucker" },
      { text: "Ne compte pas les jours, fais que les jours comptent.", author: "Muhammad Ali" },
      { text: "Un pessimiste voit la difficulté dans chaque opportunité ; un optimiste voit l'opportunité dans chaque difficulté.", author: "Winston Churchill" },
      { text: "Le doute est le commencement de la sagesse.", author: "Aristote" },
      { text: "On ne voit bien qu'avec le cœur. L'essentiel est invisible pour les yeux.", author: "Antoine de Saint-Exupéry" },
      { text: "Il vaut mieux allumer une bougie que de maudire l'obscurité.", author: "Confucius" },
      { text: "La persévérance est la clé de la réussite.", author: "Proverbe français" },
      { text: "Choisis un travail que tu aimes et tu n'auras pas à travailler un seul jour de ta vie.", author: "Confucius" },
      { text: "Le plus grand risque est de ne prendre aucun risque.", author: "Mark Zuckerberg" },
      { text: "La simplicité est la sophistication suprême.", author: "Léonard de Vinci" },
      { text: "Tout ce que tu peux imaginer est réel.", author: "Pablo Picasso" },
      { text: "Soyez vous-même, les autres sont déjà pris.", author: "Oscar Wilde" },
      { text: "Il n'est jamais trop tard pour être ce que l'on aurait pu être.", author: "George Eliot" },
      { text: "La connaissance s'acquiert par l'expérience, tout le reste n'est que de l'information.", author: "Albert Einstein" },
    ];

    const quoteEl = document.getElementById("quote");
    const authorEl = document.getElementById("author");
    const newQuoteBtn = document.getElementById("new-quote-btn");
    const copyBtn = document.getElementById("copy-btn");
    const shareBtn = document.getElementById("share-btn");
    const themeToggleBtn = document.getElementById("theme-toggle");
    const favoriteBtn = document.getElementById("favorite-btn");
    const favoritesViewBtn = document.getElementById("favorites-view-btn");
    const favoritesModal = document.getElementById("favorites-modal");
    const favoritesCloseBtn = document.getElementById("favorites-close-btn");
    const favoritesListEl = document.getElementById("favorites-list");

    let lastIndex = -1;
    let currentQuote = null;

    /**
     * Choisit un index aléatoire différent du précédent, pour éviter
     * d'afficher deux fois de suite la même citation.
     * @returns {number}
     */
    function pickRandomIndex() {
      if (QUOTES.length === 1) return 0;
      let index;
      do {
        index = Math.floor(Math.random() * QUOTES.length);
      } while (index === lastIndex);
      return index;
    }

    /**
     * Affiche une citation donnée dans la carte, avec un effet de
     * fondu optionnel, et met à jour l'état du bouton favori.
     * @param {{text: string, author: string}} quote
     * @param {boolean} [withFade=true]
     */
    function displayQuote(quote, withFade = true) {
      const render = () => {
        currentQuote = { text: quote.text, author: quote.author };
        quoteEl.textContent = `« ${quote.text} »`;
        authorEl.textContent = `— ${quote.author}`;
        quoteEl.classList.remove("fade");
        updateFavoriteButton();
      };

      if (withFade) {
        quoteEl.classList.add("fade");
        setTimeout(render, 200);
      } else {
        render();
      }
    }

    /**
     * Affiche une nouvelle citation aléatoire avec un petit effet de fondu.
     */
    function showRandomQuote() {
      const index = pickRandomIndex();
      lastIndex = index;
      displayQuote(QUOTES[index]);
    }

    /**
     * Construit le texte brut de la citation actuellement affichée.
     * @returns {string}
     */
    function getCurrentQuoteText() {
      if (currentQuote) {
        return `« ${currentQuote.text} » — ${currentQuote.author}`;
      }
      return `${quoteEl.textContent} ${authorEl.textContent}`.trim();
    }

    /**
     * Copie la citation affichée dans le presse-papiers, avec un
     * retour visuel temporaire sur le bouton.
     */
    async function copyQuote() {
      const text = getCurrentQuoteText();
      const originalLabel = copyBtn.textContent;

      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = "✅ Copié !";
      } catch (error) {
        copyBtn.textContent = "❌ Échec";
      }

      setTimeout(() => {
        copyBtn.textContent = originalLabel;
      }, 1500);
    }

    /**
     * Ouvre une fenêtre de partage de la citation sur X (Twitter).
     */
    function shareOnX() {
      const text = getCurrentQuoteText();
      const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
      window.open(url, "_blank", "noopener,noreferrer");
    }

    // --- Gestion des favoris ---

    /**
     * Récupère la liste des citations favorites depuis le localStorage.
     * @returns {Array<{text: string, author: string}>}
     */
    function getFavorites() {
      try {
        const raw = localStorage.getItem(FAVORITES_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    /**
     * Sauvegarde la liste des citations favorites dans le localStorage.
     * @param {Array<{text: string, author: string}>} favorites
     */
    function saveFavorites(favorites) {
      localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify(favorites));
    }

    /**
     * Cherche l'index d'une citation dans la liste des favoris.
     * @param {Array<{text: string, author: string}>} favorites
     * @param {{text: string, author: string}} quote
     * @returns {number}
     */
    function findFavoriteIndex(favorites, quote) {
      return favorites.findIndex(
        (fav) => fav.text === quote.text && fav.author === quote.author
      );
    }

    /**
     * Met à jour l'apparence du bouton favori selon que la citation
     * affichée est déjà enregistrée ou non.
     */
    function updateFavoriteButton() {
      if (!currentQuote) return;
      const isFavorite = findFavoriteIndex(getFavorites(), currentQuote) !== -1;
      favoriteBtn.textContent = isFavorite ? "⭐ Favori" : "☆ Favori";
      favoriteBtn.classList.toggle("is-active", isFavorite);
      favoriteBtn.setAttribute("aria-pressed", String(isFavorite));
    }

    /**
     * Met à jour le compteur affiché sur le bouton "Favoris".
     */
    function updateFavoritesCount() {
      favoritesViewBtn.textContent = `📁 Favoris (${getFavorites().length})`;
    }

    /**
     * Ajoute ou retire la citation actuellement affichée des favoris.
     */
    function toggleFavorite() {
      if (!currentQuote) return;

      const favorites = getFavorites();
      const index = findFavoriteIndex(favorites, currentQuote);

      if (index === -1) {
        favorites.push({ ...currentQuote });
      } else {
        favorites.splice(index, 1);
      }

      saveFavorites(favorites);
      updateFavoriteButton();
      updateFavoritesCount();
    }

    /**
     * Retire une citation des favoris à partir de son index dans la liste.
     * @param {number} index
     */
    function removeFavoriteAt(index) {
      const favorites = getFavorites();
      favorites.splice(index, 1);
      saveFavorites(favorites);
      renderFavoritesList();
      updateFavoriteButton();
      updateFavoritesCount();
    }

    /**
     * (Re)construit le contenu de la liste des favoris dans la modale.
     */
    function renderFavoritesList() {
      const favorites = getFavorites();
      favoritesListEl.innerHTML = "";

      if (favorites.length === 0) {
        const emptyItem = document.createElement("li");
        emptyItem.className = "favorites-empty";
        emptyItem.textContent = "Aucune citation favorite pour le moment.";
        favoritesListEl.appendChild(emptyItem);
        return;
      }

      favorites.forEach((favorite, index) => {
        const item = document.createElement("li");
        item.className = "favorite-item";

        const textBtn = document.createElement("button");
        textBtn.type = "button";
        textBtn.className = "favorite-item-text";
        textBtn.innerHTML = `« ${favorite.text} »<br><strong>— ${favorite.author}</strong>`;
        textBtn.addEventListener("click", () => {
          displayQuote(favorite, false);
          closeFavoritesModal();
        });

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "favorite-item-remove";
        removeBtn.textContent = "🗑️";
        removeBtn.setAttribute("aria-label", "Retirer cette citation des favoris");
        removeBtn.addEventListener("click", (event) => {
          event.stopPropagation();
          removeFavoriteAt(index);
        });

        item.appendChild(textBtn);
        item.appendChild(removeBtn);
        favoritesListEl.appendChild(item);
      });
    }

    /**
     * Ouvre la modale listant les citations favorites.
     */
    function openFavoritesModal() {
      renderFavoritesList();
      favoritesModal.classList.add("open");
      favoritesModal.setAttribute("aria-hidden", "false");
    }

    /**
     * Ferme la modale des favoris.
     */
    function closeFavoritesModal() {
      favoritesModal.classList.remove("open");
      favoritesModal.setAttribute("aria-hidden", "true");
    }

    // --- Gestion du thème (clair / sombre) ---

    /**
     * Applique le thème donné et met à jour l'icône du bouton.
     * @param {"light" | "dark"} theme
     */
    function applyTheme(theme) {
      document.body.classList.toggle("dark", theme === "dark");
      themeToggleBtn.textContent = theme === "dark" ? "☀️" : "🌙";
    }

    /**
     * Initialise le thème depuis le localStorage, ou selon les préférences système.
     */
    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
      const prefersDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;

      applyTheme(savedTheme || (prefersDark ? "dark" : "light"));
    }

    /**
     * Bascule entre thème clair et sombre, et sauvegarde le choix.
     */
    function toggleTheme() {
      const isDark = document.body.classList.contains("dark");
      const newTheme = isDark ? "light" : "dark";
      applyTheme(newTheme);
      localStorage.setItem(THEME_STORAGE_KEY, newTheme);
    }

    // --- Écouteurs d'évènements ---

    newQuoteBtn.addEventListener("click", showRandomQuote);
    copyBtn.addEventListener("click", copyQuote);
    shareBtn.addEventListener("click", shareOnX);
    themeToggleBtn.addEventListener("click", toggleTheme);
    favoriteBtn.addEventListener("click", toggleFavorite);
    favoritesViewBtn.addEventListener("click", openFavoritesModal);
    favoritesCloseBtn.addEventListener("click", closeFavoritesModal);

    favoritesModal.addEventListener("click", (event) => {
      if (event.target === favoritesModal) {
        closeFavoritesModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && favoritesModal.classList.contains("open")) {
        closeFavoritesModal();
      }
    });

    // --- Initialisation ---
    initTheme();
    updateFavoritesCount();
    showRandomQuote();
  </script>
</body>
</html>
